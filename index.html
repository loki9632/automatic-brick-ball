<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Brick Ball - YouTube Live</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #080d1b;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
}

header {
    padding: 15px;
    background: #101a30;
    border-bottom: 1px solid #243554;
}

h1 {
    margin: 5px;
    color: #47f5d0;
    font-size: clamp(22px, 4vw, 34px);
}

.subtitle {
    color: #9db0d0;
    font-size: 13px;
}

.stats {
    display: flex;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
    padding: 15px 8px;
}

.stat {
    min-width: 105px;
    padding: 12px 18px;
    border: 1px solid #263c5e;
    border-radius: 10px;
    background: #111c32;
}

.stat span {
    display: block;
    color: #9db0d0;
    font-size: 12px;
    margin-bottom: 5px;
}

.stat strong {
    font-size: 22px;
    color: #47f5d0;
}

.game-container {
    width: min(96vw, 900px);
    margin: 0 auto;
    overflow: hidden;
    border: 1px solid #263c5e;
    border-radius: 12px;
    background: #0b1325;
}

canvas {
    display: block;
    width: 100%;
    height: auto;
    aspect-ratio: 4 / 3;
}

.controls {
    padding: 14px;
}

button {
    padding: 11px 18px;
    margin: 4px;
    border: 0;
    border-radius: 7px;
    background: #47f5d0;
    color: #06151c;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    filter: brightness(1.1);
}

#status {
    margin: 8px;
    color: #47f5d0;
    font-size: 14px;
}

footer {
    padding: 15px;
    color: #7284a5;
    font-size: 12px;
}
</style>
</head>

<body>

<header>
    <h1>AI BRICK BALL</h1>
    <div class="subtitle">
        AUTOMATIC GAMEPLAY • SMART PADDLE • LIVE STREAM READY
    </div>
</header>

<div class="stats">
    <div class="stat">
        <span>SCORE</span>
        <strong id="score">0</strong>
    </div>

    <div class="stat">
        <span>BRICKS LEFT</span>
        <strong id="remaining">0</strong>
    </div>

    <div class="stat">
        <span>LEVEL</span>
        <strong id="level">1</strong>
    </div>

    <div class="stat">
        <span>AI STATUS</span>
        <strong id="aiStatus">ON</strong>
    </div>
</div>

<div class="game-container">
    <canvas id="game" width="800" height="600"></canvas>
</div>

<div class="controls">
    <button id="pauseButton">Pause</button>
    <button id="restartButton">Restart Game</button>
    <button id="speedButton">Speed: Normal</button>

    <div id="status">Initializing AI...</div>
    <div id="chatStatus" style="color:#9db0d0;font-size:12px;margin-top:6px">
        YouTube chat: connecting...
    </div>
    <div id="powerStatus" style="color:#ffd166;font-size:12px;margin-top:4px">
        Viewer powers: ready
    </div>
</div>

<footer>
    Automatic Brick Ball Game • Powered by JavaScript
</footer>

<script>
"use strict";

// ======================================================
// 1. CANVAS SETUP
// ======================================================

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const W = canvas.width;
const H = canvas.height;

const scoreElement = document.getElementById("score");
const remainingElement = document.getElementById("remaining");
const levelElement = document.getElementById("level");
const aiStatusElement = document.getElementById("aiStatus");
const statusElement = document.getElementById("status");

const pauseButton = document.getElementById("pauseButton");
const restartButton = document.getElementById("restartButton");
const speedButton = document.getElementById("speedButton");
const chatStatusElement = document.getElementById("chatStatus");
const powerStatusElement = document.getElementById("powerStatus");

// The game page polls the backend. Keep this URL pointed at your Hostless app.
const COMMANDS_URL = "https://brick-ball-chat.hostless.app/youtube/commands";
let chatPolling = false;
let chatPollTimer = null;
let chatRequestInProgress = false;

let powerSpeedFactor = 1;
let bigPaddleTimer = null;
let shieldCharges = 0;
let laserShots = [];
let slowPowerTimer = null;
let lastPowerMessage = "Viewer powers: ready";


// ======================================================
// 2. GAME SETTINGS
// ======================================================

const CONFIG = {
    rows: 7,
    columns: 10,

    brickWidth: 66,
    brickHeight: 19,

    brickGapX: 8,
    brickGapY: 9,

    brickTop: 75,

    paddleWidth: 110,
    paddleHeight: 13,

    paddleSpeed: 8,

    ballRadius: 7,

    baseBallSpeed: 4.2,

    maxBallSpeed: 7.5,

    wallPadding: 12
};


// ======================================================
// 3. GAME STATE
// ======================================================

let score = 0;
let level = 1;

let bricks = [];
let aiTargetBrick = null;

let paused = false;
let gameOver = false;
let speedMode = 1;

let lastTime = 0;
let animationId = null;

const keys = {
    left: false,
    right: false
};

const paddle = {
    x: W / 2 - CONFIG.paddleWidth / 2,
    y: H - 45,

    w: CONFIG.paddleWidth,
    h: CONFIG.paddleHeight,

    vx: 0
};

const ball = {
    x: W / 2,
    y: H - 65,

    r: CONFIG.ballRadius,

    vx: 2,
    vy: -CONFIG.baseBallSpeed,

    speed: CONFIG.baseBallSpeed,

    launched: true
};

// All active balls. The original `ball` remains the AI reference ball.
let balls = [ball];


// ======================================================
// 4. CREATE BRICKS
// ======================================================

function createBricks() {

    bricks = [];
    aiTargetBrick = null;

    const totalWidth =
        CONFIG.columns * CONFIG.brickWidth +
        (CONFIG.columns - 1) * CONFIG.brickGapX;

    const startX = (W - totalWidth) / 2;

    for (let row = 0; row < CONFIG.rows; row++) {

        for (
            let col = 0;
            col < CONFIG.columns;
            col++
        ) {

            const brick = {
                x: startX +
                    col * (
                        CONFIG.brickWidth +
                        CONFIG.brickGapX
                    ),

                y: CONFIG.brickTop +
                    row * (
                        CONFIG.brickHeight +
                        CONFIG.brickGapY
                    ),

                w: CONFIG.brickWidth,
                h: CONFIG.brickHeight,

                row: row,
                col: col,

                alive: true,

                color: [
                    "#ff5370",
                    "#ff8a4c",
                    "#ffd166",
                    "#48e0a4",
                    "#39c5ff",
                    "#8b80ff",
                    "#ec78e8"
                ][row]
            };

            bricks.push(brick);
        }
    }

    updateBrickCounter();
}


// ======================================================
// 5. UPDATE UI
// ======================================================

function updateBrickCounter() {

    const aliveCount = bricks.filter(
        brick => brick.alive
    ).length;

    remainingElement.textContent = aliveCount;
    scoreElement.textContent = score;
    levelElement.textContent = level;

    return aliveCount;
}


// ======================================================
// 6. RESET BALL
// ======================================================

function resetBall(targetBall = ball) {
    targetBall.x = W / 2;
    targetBall.y = H - 65;
    targetBall.speed = CONFIG.baseBallSpeed;
    targetBall.vx = targetBall.speed * 0.35;
    targetBall.vy = -Math.sqrt(
        targetBall.speed * targetBall.speed -
        targetBall.vx * targetBall.vx
    );
    targetBall.launched = true;
}

// ======================================================
// 7. FIND THE BEST TARGET BRICK
// ======================================================

function findTargetBrick() {

    const aliveBricks = bricks.filter(
        brick => brick.alive
    );

    if (aliveBricks.length === 0) {
        aiTargetBrick = null;
        return null;
    }

    // Keep the selected target until it is destroyed.
    // Then randomly choose another live brick from any row/column.
    if (
        aiTargetBrick &&
        aiTargetBrick.alive &&
        aliveBricks.includes(aiTargetBrick)
    ) {
        return aiTargetBrick;
    }

    const randomIndex = Math.floor(
        Math.random() * aliveBricks.length
    );

    aiTargetBrick = aliveBricks[randomIndex];
    return aiTargetBrick;
}

// ======================================================
// 8. AI PADDLE CONTROL
// ======================================================

function updateAI() {

    if (balls.length && balls[0] !== ball) {
        // Keep the original ball as the AI reference whenever possible.
    }
    const aiBall = balls[0] || ball;
    const targetBrick = findTargetBrick();

    let targetX = aiBall.x;

    /*
      If the ball is moving downward, predict where
      it will reach the paddle.
    */

    if (aiBall.vy > 0) {

        const timeToPaddle =
            (paddle.y - aiBall.y) / aiBall.vy;

        targetX =
            aiBall.x + aiBall.vx * timeToPaddle;

        /*
          Account for left and right wall bounces.
        */

        const left = CONFIG.wallPadding + aiBall.r;
        const right = W - CONFIG.wallPadding - aiBall.r;

        const range = right - left;

        if (range > 0) {

            let relativeX = targetX - left;

            relativeX =
                ((relativeX % (2 * range)) +
                2 * range) % (2 * range);

            if (relativeX > range) {
                relativeX = 2 * range - relativeX;
            }

            targetX = left + relativeX;
        }

    } else if (targetBrick) {

        /*
          While the ball travels upward, move toward
          the center of the remaining brick area.

          This prepares the paddle for the next bounce.
        */

        targetX =
            targetBrick.x + targetBrick.w / 2;
    }

    /*
      The paddle follows the predicted target.
    */

    const desiredPaddleX =
        targetX - paddle.w / 2;

    const difference =
        desiredPaddleX - paddle.x;

    const movement =
        Math.max(
            -CONFIG.paddleSpeed,
            Math.min(
                CONFIG.paddleSpeed,
                difference
            )
        );

    paddle.x += movement;

    paddle.x = Math.max(
        CONFIG.wallPadding,
        Math.min(
            W - CONFIG.wallPadding - paddle.w,
            paddle.x
        )
    );
}


// ======================================================
// 9. WALL COLLISIONS
// ======================================================

function handleWallCollisions(activeBall = ball) {

    const leftWall = CONFIG.wallPadding + activeBall.r;
    const rightWall = W - CONFIG.wallPadding - activeBall.r;

    if (activeBall.x <= leftWall && activeBall.vx < 0) {

        activeBall.x = leftWall;
        activeBall.vx = Math.abs(activeBall.vx);
    }

    if (activeBall.x >= rightWall && activeBall.vx > 0) {

        activeBall.x = rightWall;
        activeBall.vx = -Math.abs(activeBall.vx);
    }

    if (activeBall.y <= activeBall.r && activeBall.vy < 0) {

        activeBall.y = activeBall.r;
        activeBall.vy = Math.abs(activeBall.vy);
    }
}


// ======================================================
// 10. SWEPT COLLISION DETECTION
// ======================================================

/*
  The ball can travel across a brick between frames.

  This function checks the path between its previous
  and current positions instead of checking only
  the final position.
*/

function sweptRectangleCollision(
    oldX,
    oldY,
    newX,
    newY,
    left,
    top,
    right,
    bottom
) {

    const dx = newX - oldX;
    const dy = newY - oldY;

    let enter = 0;
    let exit = 1;

    let normalX = 0;
    let normalY = 0;

    // Horizontal intersection.

    if (Math.abs(dx) < 0.000001) {

        if (oldX < left || oldX > right) {
            return null;
        }

    } else {

        let t1 = (left - oldX) / dx;
        let t2 = (right - oldX) / dx;

        let nearX = -1;
        let farX = 1;

        if (t1 > t2) {

            [t1, t2] = [t2, t1];

            nearX = 1;
            farX = -1;
        }

        if (t1 > enter) {

            enter = t1;

            normalX = nearX;
            normalY = 0;
        }

        exit = Math.min(exit, t2);

        if (enter > exit) {
            return null;
        }
    }

    // Vertical intersection.

    if (Math.abs(dy) < 0.000001) {

        if (oldY < top || oldY > bottom) {
            return null;
        }

    } else {

        let t1 = (top - oldY) / dy;
        let t2 = (bottom - oldY) / dy;

        let nearY = -1;
        let farY = 1;

        if (t1 > t2) {

            [t1, t2] = [t2, t1];

            nearY = 1;
            farY = -1;
        }

        if (t1 > enter) {

            enter = t1;

            normalX = 0;
            normalY = nearY;
        }

        exit = Math.min(exit, t2);

        if (enter > exit) {
            return null;
        }
    }

    if (enter < 0 || enter > 1 || exit < 0) {
        return null;
    }

    return {
        time: enter,
        normalX: normalX,
        normalY: normalY
    };
}


// ======================================================
// 11. BRICK COLLISIONS
// ======================================================

function handleBrickCollisions(
    oldX,
    oldY,
    newX,
    newY,
    activeBall = ball
) {

    let firstHit = null;
    let firstBrick = null;

    for (const brick of bricks) {

        if (!brick.alive) {
            continue;
        }

        /*
          Expand the brick by the ball radius.

          The moving ball can then be treated as a point.
        */

        const collision = sweptRectangleCollision(
            oldX,
            oldY,
            newX,
            newY,

            brick.x - activeBall.r,
            brick.y - activeBall.r,

            brick.x + brick.w + activeBall.r,
            brick.y + brick.h + activeBall.r
        );

        if (!collision) {
            continue;
        }

        if (
            !firstHit ||
            collision.time < firstHit.time
        ) {

            firstHit = collision;
            firstBrick = brick;
        }
    }

    if (!firstHit || !firstBrick) {
        return;
    }

    /*
      Destroy only the first brick encountered along
      the ball's path.
    */

    firstBrick.alive = false;

    if (firstBrick === aiTargetBrick) {
        aiTargetBrick = null;
    }

    score += 10 * level;

    /*
      Move the ball to the point of impact.
    */

    activeBall.x =
        oldX + (newX - oldX) * firstHit.time;

    activeBall.y =
        oldY + (newY - oldY) * firstHit.time;

    /*
      Reverse the correct velocity component.
    */

    if (firstHit.normalX !== 0) {
        activeBall.vx = -activeBall.vx;
    }

    if (firstHit.normalY !== 0) {
        activeBall.vy = -activeBall.vy;
    }

    /*
      Move the ball a tiny distance away from the
      collision surface to avoid repeated collisions.
    */

    activeBall.x += firstHit.normalX * 0.1;
    activeBall.y += firstHit.normalY * 0.1;

    /*
      Update the speed carefully as the game progresses.
    */

    const currentSpeed = Math.sqrt(
        activeBall.vx * activeBall.vx +
        activeBall.vy * activeBall.vy
    );

    activeBall.speed = Math.min(
        CONFIG.maxBallSpeed,
        Math.max(
            currentSpeed,
            CONFIG.baseBallSpeed + level * 0.12
        )
    );

    // Preserve the direction while applying the speed.

    const length = Math.sqrt(
        activeBall.vx * activeBall.vx +
        activeBall.vy * activeBall.vy
    );

    if (length > 0) {

        activeBall.vx = activeBall.vx / length * activeBall.speed;
        activeBall.vy = activeBall.vy / length * activeBall.speed;
    }

    updateBrickCounter();

    /*
      Check whether all bricks have been cleared.
    */

    advanceLevelIfCleared();
}


// ======================================================
// 12. PADDLE COLLISION AND SMART AIMING
// ======================================================

function handlePaddleCollision(oldY, activeBall = ball) {

    const ballBottom = activeBall.y + activeBall.r;

    const paddleTop = paddle.y;
    const paddleBottom = paddle.y + paddle.h;

    const horizontalOverlap =
        activeBall.x + activeBall.r >= paddle.x &&
        activeBall.x - activeBall.r <= paddle.x + paddle.w;

    const crossedPaddle =
        oldY + activeBall.r <= paddleTop &&
        ballBottom >= paddleTop;

    if (
        activeBall.vy > 0 &&
        horizontalOverlap &&
        crossedPaddle
    ) {

        /*
          Place the ball just above the paddle.
        */

        activeBall.y = paddleTop - activeBall.r - 0.1;

        /*
          Calculate where the ball landed on the paddle.

          -1 = far left
           0 = center
          +1 = far right
        */

        const paddleCenter =
            paddle.x + paddle.w / 2;

        const hitPosition =
            (activeBall.x - paddleCenter) /
            (paddle.w / 2);

        /*
          Find a brick to target.
        */

        const targetBrick = findTargetBrick();

        let targetOffset = 0;

        if (targetBrick) {

            const targetCenter =
                targetBrick.x + targetBrick.w / 2;

            targetOffset =
                (targetCenter - activeBall.x) / (W / 2);

            targetOffset = Math.max(
                -1,
                Math.min(1, targetOffset)
            );
        }

        /*
          Combine paddle position and target direction.

          The AI tries to hit the remaining bricks
          rather than bouncing vertically forever.
        */

        let angleFactor =
            hitPosition * 0.65 +
            targetOffset * 0.85;

        angleFactor = Math.max(
            -0.85,
            Math.min(0.85, angleFactor)
        );

        /*
          Calculate the new launch angle.

          Keep a minimum upward velocity to avoid
          nearly horizontal ball movement.
        */

        const maxAngle = Math.PI * 0.38;

        const angle = angleFactor * maxAngle;

        activeBall.speed = Math.min(
            CONFIG.maxBallSpeed,
            Math.max(
                CONFIG.baseBallSpeed,
                activeBall.speed + 0.04
            )
        );

        activeBall.vx = activeBall.speed * Math.sin(angle);

        activeBall.vy = -Math.abs(
            activeBall.speed * Math.cos(angle)
        );

        /*
          Guarantee a useful upward component.
        */

        if (Math.abs(activeBall.vy) < activeBall.speed * 0.35) {

            activeBall.vy = -activeBall.speed * 0.35;

            const horizontalMagnitude = Math.sqrt(
                activeBall.speed * activeBall.speed -
                activeBall.vy * activeBall.vy
            );

            activeBall.vx =
                Math.sign(activeBall.vx || 1) *
                horizontalMagnitude;
        }

        statusElement.textContent =
            "AI targeting remaining bricks...";
    }
}


// ======================================================
// 13. AUTOMATIC BALL RECOVERY
// ======================================================

function recoverBall(activeBall = ball) {
    if (activeBall.y - activeBall.r > H) {
        if (shieldCharges > 0) {
            shieldCharges--;
            showPowerMessage("SHIELD saved a ball • " + shieldCharges + " save(s) left");
            resetBall(activeBall);
            return;
        }

        if (balls.length > 1) {
            const index = balls.indexOf(activeBall);
            if (index !== -1) balls.splice(index, 1);
            showPowerMessage("A ball was lost • " + balls.length + " ball(s) remain");
            return;
        }

        // Keep the automatic game running when its final ball is lost.
        showPowerMessage("AI recovered the final ball");
        resetBall(activeBall);
    }
}


function advanceLevelIfCleared() {
    if (bricks.some(brick => brick.alive)) return;
    level++;
    createBricks();
    laserShots = [];

    // Preserve every active ball when advancing to the next level.
    if (balls.length === 0) balls.push(ball);
    for (const activeBall of balls) resetBall(activeBall);

    statusElement.textContent = "Level cleared! Starting level " + level + "...";
    updateBrickCounter();
}

// ======================================================
// VIEWER POWERS
// ======================================================

function showPowerMessage(message) {
    lastPowerMessage = message;
    powerStatusElement.textContent = message;
}

function activateBigPaddle() {
    paddle.w = Math.min(190, CONFIG.paddleWidth * 1.65);
    paddle.x = Math.max(
        CONFIG.wallPadding,
        Math.min(W - CONFIG.wallPadding - paddle.w, paddle.x)
    );

    if (bigPaddleTimer) clearTimeout(bigPaddleTimer);
    bigPaddleTimer = setTimeout(() => {
        paddle.w = CONFIG.paddleWidth;
        paddle.x = Math.max(
            CONFIG.wallPadding,
            Math.min(W - CONFIG.wallPadding - paddle.w, paddle.x)
        );
        showPowerMessage("Big paddle expired");
        bigPaddleTimer = null;
    }, 12000);

    showPowerMessage("BIG PADDLE active for 12 seconds");
}

function activateSlow() {
    powerSpeedFactor = 0.60;
    if (slowPowerTimer) clearTimeout(slowPowerTimer);
    showPowerMessage("SLOW active for 8 seconds");
    slowPowerTimer = setTimeout(() => {
        powerSpeedFactor = 1;
        slowPowerTimer = null;
        showPowerMessage("Slow effect expired");
    }, 8000);
}

function activateMultiball() {
    const maximumBalls = 5;
    if (balls.length >= maximumBalls) {
        showPowerMessage("MULTIBALL: maximum of " + maximumBalls + " balls already active");
        return;
    }

    const source = balls[0] || ball;
    const available = maximumBalls - balls.length;
    const spawnCount = Math.min(2, available);

    for (let i = 0; i < spawnCount; i++) {
        const angle = (i === 0 ? -0.48 : 0.48);
        const speed = Math.max(CONFIG.baseBallSpeed, source.speed);
        const clone = {
            x: source.x + (i === 0 ? -10 : 10),
            y: source.y,
            r: source.r,
            vx: speed * Math.sin(angle),
            vy: -Math.abs(speed * Math.cos(angle)),
            speed: speed,
            launched: true
        };
        balls.push(clone);
    }
    showPowerMessage("MULTIBALL active • " + balls.length + " balls in play");
}

function activateShield() {
    shieldCharges = Math.min(shieldCharges + 1, 3);
    showPowerMessage("SHIELD ready: " + shieldCharges + " save(s)");
}

function activateClearRow() {
    // Clear the lowest occupied row first.
    for (let row = CONFIG.rows - 1; row >= 0; row--) {
        const rowBricks = bricks.filter(b => b.alive && b.row === row);
        if (rowBricks.length) {
            rowBricks.forEach(b => {
                b.alive = false;
                score += 10 * level;
            });
            if (aiTargetBrick && !aiTargetBrick.alive) {
                aiTargetBrick = null;
            }
            updateBrickCounter();
            showPowerMessage("CLEAR ROW: removed " + rowBricks.length + " bricks");
            advanceLevelIfCleared();
            return;
        }
    }
    showPowerMessage("CLEAR ROW: no bricks left");
}

function activateLaser() {
    // Fire a pair of upward-moving shots from the paddle.
    const center = paddle.x + paddle.w / 2;
    laserShots.push(
        { x: center - 22, y: paddle.y - 4, speed: 8 },
        { x: center + 22, y: paddle.y - 4, speed: 8 }
    );
    showPowerMessage("LASER fired");
}

function updateLaserShots() {
    for (let i = laserShots.length - 1; i >= 0; i--) {
        const shot = laserShots[i];
        shot.y -= shot.speed;

        let hit = false;
        for (const brick of bricks) {
            if (
                brick.alive &&
                shot.x >= brick.x &&
                shot.x <= brick.x + brick.w &&
                shot.y >= brick.y &&
                shot.y <= brick.y + brick.h
            ) {
                brick.alive = false;
                score += 10 * level;
                hit = true;
                break;
            }
        }

        if (hit || shot.y < 0) laserShots.splice(i, 1);
    }

    updateBrickCounter();
    advanceLevelIfCleared();
}

function drawLaserShots() {
    ctx.save();
    ctx.fillStyle = "#ff4dff";
    ctx.shadowColor = "#ff4dff";
    ctx.shadowBlur = 12;
    for (const shot of laserShots) {
        ctx.fillRect(shot.x - 2, shot.y - 9, 4, 13);
    }
    ctx.restore();
}

function applyViewerCommand(command) {
    switch (command) {
        case "!laser":
            activateLaser();
            break;
        case "!bigpaddle":
            activateBigPaddle();
            break;
        case "!slow":
            activateSlow();
            break;
        case "!shield":
            activateShield();
            break;
        case "!clearrow":
            activateClearRow();
            break;
        case "!multiball":
            activateMultiball();
            break;
        default:
            break;
    }
}

function applyPaidEvent(item) {
    if (!item || item.type !== "superchat" || item.verified_event !== true) return;
    if (!item.command) {
        showPowerMessage("Super Chat received (" + (item.amount_display || "below power threshold") + ") • no power assigned");
        return;
    }
    const paidPower = String(item.command).toLowerCase();
    const allowed = new Set(["laser", "bigpaddle", "slow", "shield", "clearrow", "multiball"]);
    if (!allowed.has(paidPower)) return;
    applyViewerCommand("!" + paidPower);
    showPowerMessage("SUPER CHAT " + (item.amount_display || "") + " • " + paidPower.toUpperCase() + " activated");
}

// Poll once per response interval. This endpoint uses a shared in-memory cursor,
// so run only one game tab while testing.
async function pollYouTubeCommands() {
    if (chatRequestInProgress) return;
    chatRequestInProgress = true;

    try {
        const response = await fetch(COMMANDS_URL, { method: "GET", cache: "no-store" });
        if (!response.ok) {
            throw new Error("Backend returned HTTP " + response.status);
        }

        const data = await response.json();
        if (data.status !== "ok" || !Array.isArray(data.commands)) {
            throw new Error("Unexpected command response");
        }

        chatStatusElement.textContent =
            "YouTube chat: connected • polling " +
            (data.polling_interval_ms || 1000) + " ms";

        for (const item of data.commands) {
            if (item && item.type === "free" && typeof item.command === "string") {
                applyViewerCommand(item.command);
            } else if (item && item.type === "superchat") {
                applyPaidEvent(item);
            } else if (item && item.type === "supersticker" && item.verified_event === true) {
                showPowerMessage("Super Sticker received • no power assigned yet");
            }
        }

        const delay = Math.max(900, Number(data.polling_interval_ms) || 1000);
        chatPollTimer = setTimeout(pollYouTubeCommands, delay);
    } catch (error) {
        chatStatusElement.textContent = "YouTube chat: connection error — " + error.message;
        chatPollTimer = setTimeout(pollYouTubeCommands, 5000);
    } finally {
        chatRequestInProgress = false;
    }
}

// ======================================================
// 14. UPDATE GAME PHYSICS
// ======================================================

function update() {
    if (paused || gameOver) return;

    updateAI();
    updateLaserShots();

    // Iterate backwards because recovery may remove a ball from the array.
    for (let i = balls.length - 1; i >= 0; i--) {
        const activeBall = balls[i];
        const oldX = activeBall.x;
        const oldY = activeBall.y;

        const newX = oldX + activeBall.vx * speedMode * powerSpeedFactor;
        const newY = oldY + activeBall.vy * speedMode * powerSpeedFactor;

        activeBall.x = newX;
        activeBall.y = newY;

        handleWallCollisions(activeBall);
        handleBrickCollisions(oldX, oldY, newX, newY, activeBall);
        handlePaddleCollision(oldY, activeBall);
        recoverBall(activeBall);
    }

    scoreElement.textContent = score;
    levelElement.textContent = level;
    aiStatusElement.textContent = "ON";
}

// ======================================================
// 15. DRAW BACKGROUND
// ======================================================

function drawBackground() {

    const gradient = ctx.createLinearGradient(
        0, 0, W, H
    );

    gradient.addColorStop(0, "#0a1125");
    gradient.addColorStop(1, "#111b34");

    ctx.fillStyle = gradient;

    ctx.fillRect(0, 0, W, H);

    /*
      Draw a subtle grid.
    */

    ctx.strokeStyle = "rgba(100,150,220,0.06)";
    ctx.lineWidth = 1;

    for (let x = 0; x < W; x += 40) {

        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, H);
        ctx.stroke();
    }

    for (let y = 0; y < H; y += 40) {

        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(W, y);
        ctx.stroke();
    }
}


// ======================================================
// 16. DRAW BRICKS
// ======================================================

function drawBricks() {

    for (const brick of bricks) {

        if (!brick.alive) {
            continue;
        }

        /*
          Brick shadow.
        */

        ctx.shadowColor = brick.color;
        ctx.shadowBlur = 8;

        ctx.fillStyle = brick.color;

        ctx.beginPath();

        ctx.roundRect(
            brick.x,
            brick.y,
            brick.w,
            brick.h,
            5
        );

        ctx.fill();

        /*
          Highlight at the top.
        */

        ctx.shadowBlur = 0;

        ctx.fillStyle =
            "rgba(255,255,255,0.25)";

        ctx.fillRect(
            brick.x + 5,
            brick.y + 3,
            brick.w - 10,
            2
        );
    }

    ctx.shadowBlur = 0;
}


// ======================================================
// 17. DRAW PADDLE
// ======================================================

function drawPaddle() {

    const gradient = ctx.createLinearGradient(
        paddle.x,
        paddle.y,
        paddle.x,
        paddle.y + paddle.h
    );

    gradient.addColorStop(0, "#a1fff0");
    gradient.addColorStop(1, "#23cbb5");

    ctx.shadowColor = "#47f5d0";
    ctx.shadowBlur = 18;

    ctx.fillStyle = gradient;

    ctx.beginPath();

    ctx.roundRect(
        paddle.x,
        paddle.y,
        paddle.w,
        paddle.h,
        7
    );

    ctx.fill();

    ctx.shadowBlur = 0;
}


// ======================================================
// 18. DRAW BALL
// ======================================================

function drawBall(activeBall = ball) {

    /*
      Ball trail.
    */

    ctx.globalAlpha = 0.18;

    ctx.fillStyle = "#47f5d0";

    ctx.beginPath();

    ctx.arc(
        activeBall.x - activeBall.vx * 2,
        activeBall.y - activeBall.vy * 2,
        activeBall.r * 1.4,
        0,
        Math.PI * 2
    );

    ctx.fill();

    ctx.globalAlpha = 1;

    /*
      Main activeBall.
    */

    ctx.shadowColor = "#47f5d0";
    ctx.shadowBlur = 18;

    const gradient = ctx.createRadialGradient(
        activeBall.x - 2,
        activeBall.y - 2,
        1,
        activeBall.x,
        activeBall.y,
        activeBall.r
    );

    gradient.addColorStop(0, "#ffffff");
    gradient.addColorStop(0.4, "#aafff0");
    gradient.addColorStop(1, "#24d8ba");

    ctx.fillStyle = gradient;

    ctx.beginPath();

    ctx.arc(
        activeBall.x,
        activeBall.y,
        activeBall.r,
        0,
        Math.PI * 2
    );

    ctx.fill();

    ctx.shadowBlur = 0;
}


// ======================================================
// 19. DRAW GAME INFORMATION
// ======================================================

function drawGameInfo() {

    ctx.fillStyle = "#91a6c9";
    ctx.font = "13px Arial";

    ctx.textAlign = "left";

    ctx.fillText(
        "AI CONTROL ACTIVE • BALLS " + balls.length,
        18,
        H - 15
    );

    ctx.textAlign = "right";

    ctx.fillText(
        "LEVEL " + level,
        W - 18,
        H - 15
    );

    ctx.textAlign = "left";
}


// ======================================================
// 20. DRAW PAUSE / GAME OVER
// ======================================================

function drawOverlay(title, subtitle) {

    ctx.fillStyle = "rgba(3,8,20,0.78)";

    ctx.fillRect(0, 0, W, H);

    ctx.textAlign = "center";

    ctx.fillStyle = "#47f5d0";

    ctx.font = "bold 36px Arial";

    ctx.fillText(
        title,
        W / 2,
        H / 2 - 15
    );

    ctx.fillStyle = "#ffffff";

    ctx.font = "16px Arial";

    ctx.fillText(
        subtitle,
        W / 2,
        H / 2 + 25
    );

    ctx.textAlign = "left";
}


// ======================================================
// 21. RENDER FRAME
// ======================================================

function draw() {

    drawBackground();

    drawBricks();

    drawPaddle();

    for (const activeBall of balls) drawBall(activeBall);
    drawLaserShots();

    drawGameInfo();

    if (paused) {

        drawOverlay(
            "PAUSED",
            "Press Resume to continue"
        );
    }
}


// ======================================================
// 22. MAIN GAME LOOP
// ======================================================

function gameLoop(timestamp) {

    if (!lastTime) {
        lastTime = timestamp;
    }

    /*
      Limit large frame delays to prevent sudden
      jumps after switching browser tabs.
    */

    const delta = Math.min(
        (timestamp - lastTime) / 16.667,
        2
    );

    lastTime = timestamp;

    /*
      Use small physics steps for more reliable
      collision handling.
    */

    if (!paused && !gameOver) {

        const steps = Math.max(
            1,
            Math.ceil(delta * speedMode)
        );

        for (let i = 0; i < steps; i++) {
            update();
        }
    }

    draw();

    animationId = requestAnimationFrame(gameLoop);
}


// ======================================================
// 23. PAUSE / RESUME
// ======================================================

pauseButton.addEventListener(
    "click",
    function () {

        paused = !paused;

        pauseButton.textContent =
            paused ? "Resume" : "Pause";

        statusElement.textContent =
            paused
                ? "Game paused"
                : "AI running automatically";

        lastTime = 0;
    }
);


// ======================================================
// 24. RESTART GAME
// ======================================================

function restartGame() {

    score = 0;
    level = 1;

    paused = false;
    gameOver = false;

    paddle.w = CONFIG.paddleWidth;
    paddle.x = W / 2 - paddle.w / 2;
    powerSpeedFactor = 1;
    shieldCharges = 0;
    laserShots = [];
    balls = [ball];
    if (slowPowerTimer) {
        clearTimeout(slowPowerTimer);
        slowPowerTimer = null;
    }
    if (bigPaddleTimer) {
        clearTimeout(bigPaddleTimer);
        bigPaddleTimer = null;
    }

    createBricks();

    resetBall();

    pauseButton.textContent = "Pause";

    statusElement.textContent =
        "AI running automatically";

    lastTime = 0;
}

restartButton.addEventListener(
    "click",
    restartGame
);


// ======================================================
// 25. SPEED CONTROL
// ======================================================

speedButton.addEventListener(
    "click",
    function () {

        if (speedMode === 1) {

            speedMode = 1.5;

            speedButton.textContent =
                "Speed: Fast";

        } else if (speedMode === 1.5) {

            speedMode = 0.75;

            speedButton.textContent =
                "Speed: Slow";

        } else {

            speedMode = 1;

            speedButton.textContent =
                "Speed: Normal";
        }
    }
);


// ======================================================
// 26. OPTIONAL MANUAL CONTROLS
// ======================================================

/*
  These controls are optional.

  The AI remains responsible for paddle movement.
  Pressing the arrow keys temporarily moves the paddle.
*/

window.addEventListener(
    "keydown",
    function (event) {

        if (
            event.key === "ArrowLeft" ||
            event.key === "ArrowRight"
        ) {
            event.preventDefault();
        }

        if (event.key === "ArrowLeft") {
            keys.left = true;
        }

        if (event.key === "ArrowRight") {
            keys.right = true;
        }

        if (
            event.code === "Space" &&
            !event.repeat
        ) {
            paused = !paused;

            pauseButton.textContent =
                paused ? "Resume" : "Pause";

            lastTime = 0;
        }
    }
);

window.addEventListener(
    "keyup",
    function (event) {

        if (event.key === "ArrowLeft") {
            keys.left = false;
        }

        if (event.key === "ArrowRight") {
            keys.right = false;
        }
    }
);


// ======================================================
// 27. INITIALIZE GAME
// ======================================================

function initializeGame() {

    createBricks();
    balls = [ball];
    resetBall(ball);

    statusElement.textContent =
        "AI running automatically";

    scoreElement.textContent = score;
    levelElement.textContent = level;

    aiStatusElement.textContent = "ON";

    if (animationId !== null) {
        cancelAnimationFrame(animationId);
    }

    lastTime = 0;

    animationId = requestAnimationFrame(gameLoop);
}

initializeGame();
pollYouTubeCommands();

</script>

</body>
</html>
